services:
  chefs:
    image: whereshype/chefs:${VERSION:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        # Ao Lume dataset in Meta Events Manager. Public by design (it is visible in the page).
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-4635877023399415}
        NEXT_DEPLOYMENT_ID: ${VERSION:-dev}
    container_name: chefs
    restart: unless-stopped
    networks:
      - sites_proxy
    environment:
      VIRTUAL_HOST: aolume.com,www.aolume.com
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: aolume.com,www.aolume.com
      VERSION: ${VERSION:-latest}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # --- Pagamentos ---------------------------------------------------------
      # Ligar ou desligar os pagamentos faz-se em /admin/pagamentos, não aqui: as regras que
      # decidem dinheiro são triggers na base de dados, e um trigger não lê uma variável de
      # ambiente. O que fica aqui é o que o servidor precisa para conseguir cobrar.
      EUPAGO_ENV: ${EUPAGO_ENV:-sandbox}
      EUPAGO_API_KEY: ${EUPAGO_API_KEY:-}
      EUPAGO_WEBHOOK_SECRET: ${EUPAGO_WEBHOOK_SECRET:-}
      EUPAGO_WEBHOOK_ENCRYPTION_KEY: ${EUPAGO_WEBHOOK_ENCRYPTION_KEY:-}
      EUPAGO_CLIENT_ID: ${EUPAGO_CLIENT_ID:-}
      EUPAGO_CLIENT_SECRET: ${EUPAGO_CLIENT_SECRET:-}
      # Cifra os IBAN guardados. Perder esta chave torna-os ilegíveis: guarde uma cópia.
      PAYOUT_ENCRYPTION_KEY: ${PAYOUT_ENCRYPTION_KEY:-}
      # Conta de onde saem as transferências para os chefs (ficheiro SEPA).
      PLATFORM_ACCOUNT_NAME: ${PLATFORM_ACCOUNT_NAME:-}
      PLATFORM_IBAN: ${PLATFORM_IBAN:-}
      PLATFORM_BIC: ${PLATFORM_BIC:-}
      # Segredo do endpoint de reconciliação, chamado pelo cron.
      RECONCILE_SECRET: ${RECONCILE_SECRET:-}
      # Avisos no Discord. Opcionais: sem URL, o aviso não é enviado.
      DISCORD_WEBHOOK_CHEF_SIGNUP: ${DISCORD_WEBHOOK_CHEF_SIGNUP:-}
      DISCORD_WEBHOOK_USER_SIGNUP: ${DISCORD_WEBHOOK_USER_SIGNUP:-}
      DISCORD_WEBHOOK_CHEF_REVIEW: ${DISCORD_WEBHOOK_CHEF_REVIEW:-}

networks:
  sites_proxy:
    external: true
