services:
  chefs:
    image: whereshype/chefs:${VERSION:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        # Ao Lume dataset in Meta Events Manager. Public by design (it is visible in the page).
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-4635877023399415}
        NEXT_DEPLOYMENT_ID: ${VERSION:-dev}
    container_name: chefs
    restart: unless-stopped
    networks:
      - sites_proxy
    environment:
      VIRTUAL_HOST: aolume.com,www.aolume.com
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: aolume.com,www.aolume.com
      VERSION: ${VERSION:-latest}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}

networks:
  sites_proxy:
    external: true
